name: BookStore .NET CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore BookStore.slnx

      - name: Build solution
        run: dotnet build BookStore.slnx --configuration Release --no-restore

      - name: Run unit and Stream I/O tests
        run: dotnet test BookStore.slnx --configuration Release --no-build --verbosity normal
